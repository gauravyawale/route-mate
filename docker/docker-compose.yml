services:
  # ────────────────────────────────────────────────
  # PostgreSQL 15 with PostGIS
  # ────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: route-mate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: routemate
      POSTGRES_PASSWORD: routemate_dev
      POSTGRES_DB: routemate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - route-mate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routemate -d routemate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────
  # Redis 7
  # ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: route-mate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - route-mate-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # ────────────────────────────────────────────────
  # BullMQ Worker
  # ────────────────────────────────────────────────
  worker:
    image: node:20-alpine
    container_name: route-mate-worker
    restart: unless-stopped
    working_dir: /app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ../:/app
      - /app/node_modules                    # anonymous volume shields root node_modules
      - /app/apps/api/node_modules           # shields api node_modules
      - /app/packages/shared/node_modules    # shields shared node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://routemate:routemate_dev@postgres:5432/routemate_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - OTP_EXPIRY_SECONDS=300
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - route-mate-network
    command: >
      sh -c "
        cd /app &&
        yarn install --frozen-lockfile &&
        yarn workspace @route-mate/shared build &&
        yarn workspace @route-mate/api dev:worker
      "

# ────────────────────────────────────────────────
# OSRM — Open Source Routing Machine
# ────────────────────────────────────────────────
  osrm:
    image: osrm/osrm-backend
    container_name: route-mate-osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/map.osrm

# ────────────────────────────────────────────────
# Volumes — persist data between container restarts
# ────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ────────────────────────────────────────────────
# Network — containers talk to each other by name
# ────────────────────────────────────────────────
networks:
  route-mate-network:
    driver: bridge
