<!DOCTYPE html>
<html>

<head>
    <title>Socket Test</title>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
</head>

<body>
    <h1>Socket.io Test</h1>
    <div id="log"></div>

    <script>
        const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3YmMzYzQ0MC04OTU5LTRmMzItYmJhZi02MmM2YTNmNDgzNjYiLCJtb2RlIjoicmlkZXIiLCJpYXQiOjE3ODA4NTUyODIsImV4cCI6MTc4MDg1NjE4Mn0.rNz2w1yIelmmkAomP5yS4h2dzRSQSC14hkz5Wd5rh5U";

        const socket = io("http://localhost:3000", {
            auth: { token },
            transports: ["websocket", "polling"]
        });

        function log(msg, color = "black") {
            console.log(msg);
            const div = document.getElementById("log");
            div.innerHTML += `<p style="color:${color}">${msg}</p>`;
        }

        socket.on("connect", () => {
            log("✅ Connected: " + socket.id, "green");
        });

        socket.on("connect_error", (err) => {
            log("❌ Error: " + err.message, "red");
        });

        socket.on("booking.requested", (data) => {
            log("📦 booking.requested: " + JSON.stringify(data), "blue");
        });

        socket.on("booking.confirmed", (data) => {
            log("✅ booking.confirmed: " + JSON.stringify(data), "blue");
        });

        socket.on("payment.completed", (data) => {
            log("💰 payment.completed: " + JSON.stringify(data), "purple");
        });

        socket.on("ride.status_changed", (data) => {
            log("🚗 ride.status_changed: " + JSON.stringify(data), "orange");
        });

        socket.on("booking.no_seat", (data) => {
            log("❌ booking.no_seat: " + JSON.stringify(data), "red");
        });
    </script>
</body>

</html>
